<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoodCheck</title>
  <meta name="description" content="A short check-in quiz that finds your mood and gives you a tip and a quote.">
  <meta name="theme-color" content="#f4f1ea">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🙂</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="start">
  <noscript><p style="padding: 20px;">MoodCheck needs JavaScript to run.</p></noscript>

  <canvas id="confetti"></canvas>

  <header class="topbar">
    <span class="logo">MoodCheck</span>

    <div class="tools">
      <div class="themes" role="group" aria-label="Theme">
        <button class="theme-btn" data-theme="normal" title="Normal" aria-label="Normal theme">☀️</button>
        <button class="theme-btn" data-theme="night" title="Night" aria-label="Night theme">🌙</button>
        <button class="theme-btn" data-theme="cute" title="Cute" aria-label="Cute theme">🌸</button>
      </div>

      <div class="sound-box" id="soundBox">
        <button class="icon-btn" id="speakerBtn" title="Sound" aria-label="Sound settings" aria-expanded="false">🔊</button>
        <div class="volume-panel" id="volumePanel">
          <div class="sound-row">
            <span>🔔 Sounds</span>
            <input type="range" id="soundVolume" min="0" max="100" value="80" aria-label="Sounds volume">
            <button id="soundMuteBtn">Mute</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="app">
    <div class="content">
      <section id="start" class="screen active">
        <h1>MoodCheck</h1>
        <p class="tagline">How are you feeling today?</p>
        <button class="primary" id="startBtn">Start</button>
        <p class="history" id="history"></p>
      </section>

      <section id="quiz" class="screen">
        <div class="dots" id="dots"></div>
        <h2 id="question"></h2>
        <div class="options" id="options"></div>
        <button class="back" id="backBtn" hidden>Previous question</button>
      </section>

      <section id="result" class="screen">
        <p class="label">Your mood today</p>
        <h2 id="moodName"></h2>
        <p class="desc" id="moodDesc"></p>
        <div class="recipe" id="recipe"></div>
        <div class="pills" id="pills"></div>
        <p class="tip" id="tip"></p>
        <p class="note" id="care" hidden></p>
        <p class="note" id="skipNote" hidden></p>
        <blockquote>
          <p id="quote"></p>
          <footer id="author"></footer>
        </blockquote>
        <div class="row">
          <button id="anotherBtn">New quote</button>
          <button id="changeBtn">Change answers</button>
          <button class="primary" id="againBtn">Start again</button>
        </div>
      </section>

    </div>
  </main>

  <footer class="footer">A small project made with HTML, CSS and JavaScript.</footer>

  <script src="script.js"></script>
</body>
</html>
